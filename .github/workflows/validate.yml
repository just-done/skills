name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate plugin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          npm install --global @anthropic-ai/claude-code@2.1.273
          python -m pip install --disable-pip-version-check --require-hashes -r .github/requirements.txt

      - name: Check JSON syntax
        run: git ls-files -z '*.json' | xargs -0 -n1 jq empty

      - name: Validate plugin manifest
        run: claude plugin validate .claude-plugin/plugin.json --strict

      - name: Validate marketplace manifest
        run: claude plugin validate . --strict

      - name: Validate skills with the Agent Skills reference validator
        run: |
          for dir in skills/*/; do
            agentskills validate "$dir"
          done

      - name: Check metadata consistency
        run: python .github/scripts/check_metadata.py

      - name: Require a version bump for skill or server changes
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          base="origin/${BASE_REF}"
          if git diff --name-only "${base}...HEAD" | grep -qE '^(skills/|\.mcp\.json$)'; then
            previous=$(git show "${base}:.claude-plugin/plugin.json" 2>/dev/null | jq -r '.version // empty' || true)
            current=$(jq -r '.version' .claude-plugin/plugin.json)
            if [ -n "${previous}" ] && [ "${previous}" = "${current}" ]; then
              echo "::error file=.claude-plugin/plugin.json::skills/ or .mcp.json changed; bump the version and update CHANGELOG.md"
              exit 1
            fi
          fi
